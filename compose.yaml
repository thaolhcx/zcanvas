name: zcanvas
services:
  postgres:
    # Postgres 16 with pgvector for semantic asset search (pg_trgm is in contrib).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zcanvas
      POSTGRES_PASSWORD: zcanvas
      POSTGRES_DB: zcanvas
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcanvas"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Optional: only needed with STORAGE_DRIVER=s3.
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: zcanvas
      MINIO_ROOT_PASSWORD: zcanvas-local-only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio:/data"]
volumes:
  postgres:
  # Optional: only needed with STORAGE_DRIVER=s3.
  minio:
